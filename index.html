<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8b2635"><link rel="manifest" href="manifest.json"><title>Mi Día · Metropol Fincas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--b:#8b2635;--bs:#f7e8eb;--t:#327878;--ts:#e4f3f2;--bg:#f5f2f3;--tx:#292529;--mu:#817a80;--ln:#e2dce0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:var(--tx)}button,input,select,textarea{font:inherit}.app{max-width:850px;margin:auto;min-height:100vh}.head{background:linear-gradient(135deg,#7c1f2e,#a83649);color:#fff;padding:20px 18px 16px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:20px}.sub{opacity:.84;font-size:11px}.tabs{display:flex;gap:6px;margin-top:14px;overflow:auto}.tab{border:0;border-radius:20px;padding:8px 13px;background:#ffffff22;color:#fff;font-weight:800}.tab.on{background:#fff;color:var(--b)}main{padding:14px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:850}.primary{background:var(--b);color:#fff}.secondary{background:#fff;border:1px solid var(--ln)}.voice{flex:1;min-width:160px}.card{position:relative;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:13px;margin:9px 0}.row{display:flex;gap:10px;align-items:flex-start}.check{width:24px;height:24px;border:2px solid var(--b);border-radius:8px;background:#fff;flex:0 0 auto}.check.done{background:var(--b);color:#fff}.title{font-weight:850;font-size:15px}.doneText{text-decoration:line-through;opacity:.5}.details{font-size:12px;color:var(--mu);margin-top:5px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;padding:4px 7px;border-radius:999px;background:#f1edef;color:#625b61}.mine{background:var(--bs);color:var(--b)}.office{background:var(--ts);color:var(--t)}.more{border:0;background:transparent;font-size:24px;line-height:1;padding:2px 4px;color:#837d82}.menu{display:none;position:absolute;right:10px;top:40px;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:5px;box-shadow:0 8px 24px #0002;z-index:4;min-width:150px}.menu.on{display:block}.menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:8px}.menu .danger{color:#a4283b}.empty{text-align:center;color:var(--mu);padding:50px 10px}.login{max-width:430px;margin:9vh auto;background:#fff;padding:24px;border-radius:20px;border:1px solid var(--ln)}label{display:block;font-size:11px;font-weight:850;color:var(--mu);margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid var(--ln);border-radius:12px;padding:11px;background:#fff}textarea{min-height:80px}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:15px;overflow:auto}.overlay.on{display:block}.panel{max-width:540px;margin:4vh auto;background:#fff;border-radius:20px;padding:18px}.voicegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vbtn{padding:18px 8px;border:1px solid var(--ln);border-radius:15px;background:#fff;font-weight:900}.preview{background:#faf8f9;border:1px solid var(--ln);border-radius:12px;padding:10px;margin:10px 0}.calSwitch{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#fff;border:1px solid var(--ln);border-radius:10px;min-height:90px;padding:5px;font-size:10px}.day.today{border:2px solid var(--b)}.mini{padding:3px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bs)}.mini.office{background:var(--ts)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#292529;color:#fff;padding:10px 15px;border-radius:12px;display:none;z-index:40;max-width:88%}@media(max-width:600px){.calendar{gap:2px}.day{min-height:72px;padding:3px}.mini{font-size:8px}}</style></head><body>
<div id="login" class="login"><div class="brand" style="color:var(--b)">METROPOL FINCAS</div><h2>Mi Día</h2><p>Acceso privado para el equipo.</p><label>Correo</label><input id="email" type="email"><label>Contraseña</label><input id="password" type="password"><button class="btn primary" style="width:100%;margin-top:14px" onclick="login()">Entrar</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="register()">Primer acceso / crear contraseña</button><p id="authmsg" style="font-size:12px;color:var(--mu)"></p></div>
<div id="app" class="app" hidden><header class="head"><div class="brand">METROPOL FINCAS · MI DÍA</div><div class="sub" id="who"></div><div class="tabs"><button class="tab on" data-v="mine">MÍO</button><button class="tab" data-v="office">OFICINA</button><button class="tab" data-v="all">TODAS</button><button class="tab" data-v="calendar">CALENDARIO</button></div></header><main><div class="bar"><button class="btn primary voice" onclick="openVoice()">🎙 HABLAR</button><button class="btn secondary" onclick="openEditor()">＋ Tarea</button><button class="btn secondary" onclick="logout()">Salir</button></div><div id="calendarControls" hidden><div class="calSwitch"><button class="btn secondary" onclick="calMode='week';calOffset=0;renderCalendar()">SEMANA</button><button class="btn secondary" onclick="calMode='month';calOffset=0;renderCalendar()">MES</button><button class="btn secondary" onclick="moveCal(-1)">‹</button><button class="btn secondary" onclick="calOffset=0;renderCalendar()">Hoy</button><button class="btn secondary" onclick="moveCal(1)">›</button></div><h3 id="calTitle"></h3><div id="cal" class="calendar"></div></div><div id="list"></div></main></div>
<div class="overlay" id="editor"><div class="panel"><h3 id="edTitle">Nueva tarea</h3><input type="hidden" id="tid"><label>Tarea</label><input id="title"><label>Información adicional</label><textarea id="details"></textarea><label>Canal</label><select id="channel" onchange="refreshAssignmentState()"><option value="mine">MÍO · privado</option><option value="office">OFICINA · compartido</option></select><label>Asignar a</label><select id="assigned"><option value="">Sin asignar</option></select><label>Comunidad</label><select id="community"><option value="">Sin comunidad</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Fecha</label><input id="date" type="date"></div><div><label>Hora</label><input id="time" type="time"></div></div><label>Aviso</label><select id="reminder"><option value="">Sin aviso</option><option value="0">A la hora</option><option value="5">5 minutos antes</option><option value="15">15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option><option value="1440">24 horas antes</option></select><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveTask()">Guardar</button><button class="btn secondary" style="width:100%;margin-top:7px" onclick="closeEditor()">Cancelar</button></div></div>
<div class="overlay" id="voice"><div class="panel"><h3>Dictar tarea</h3><div class="voicegrid"><button class="vbtn" onclick="listen('message')">🎙 MENSAJE<br><small>Qué hay que hacer</small></button><button class="vbtn" onclick="listen('instructions')">🎙 INSTRUCCIONES<br><small>Persona, comunidad, día y hora</small></button></div><label>Mensaje</label><textarea id="vpmsg" placeholder="Dicta o escribe la tarea"></textarea><div class="details">Puedes corregir aquí el texto después de dictarlo.</div><label>Instrucciones</label><textarea id="vpins" placeholder="Cristina, oficina, Campoalegre 26, mañana a las diez"></textarea><div class="details">Puedes corregir también las instrucciones antes de crear la tarea.</div><button class="btn primary" style="width:100%;margin-top:12px" onclick="createVoiceTask()">Crear tarea</button><button class="btn secondary" style="width:100%;margin-top:7px" onclick="closeVoice()">Cancelar</button></div></div><div class="toast" id="toast"></div>
<script>
const SB_URL='https://jowevvdsndfmzhkqyara.supabase.co',SB_KEY='sb_publishable_W_oBMhK-Sy9i4XBVuFTYXQ_DC-9-GZz';const sb=supabase.createClient(SB_URL,SB_KEY);let user=null,tasks=[],team=[],communities=[],view='mine',calMode='week',calOffset=0,voiceDraft={message:'',instructions:'',parsed:{}};const $=id=>document.getElementById(id);const esc=s=>(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const iso=d=>{const x=new Date(d||Date.now()),off=x.getTimezoneOffset();return new Date(x.getTime()-off*60000).toISOString().slice(0,10)};function msg(t){$('authmsg').textContent=t}function toast(t){let x=$('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
async function login(){let {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message);await boot()}async function register(){let e=$('email').value.trim(),p=$('password').value;if(p.length<6)return msg('La contraseña debe tener al menos 6 caracteres.');let {error}=await sb.auth.signUp({email:e,password:p});msg(error?error.message:'Usuario creado. Si recibes un correo de confirmación, confírmalo y después pulsa Entrar.')}async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){let {data:{session}}=await sb.auth.getSession();if(!session)return;$('login').hidden=true;$('app').hidden=false;user=session.user;$('who').textContent=user.email;let [tm,cm]=await Promise.all([sb.rpc('get_mi_dia_team'),sb.from('communities').select('id,name').eq('active',true).order('name')]);if(tm.error){await sb.auth.signOut();alert('Este usuario no está autorizado para Mi Día.');return location.reload()}team=tm.data||[];communities=cm.data||[];fillSelects();await loadTasks();sb.channel('mi-dia').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>loadTasks()).subscribe();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
function fillSelects(){$('assigned').innerHTML='<option value="">Sin asignar</option>'+team.map(x=>`<option value="${esc(x.email)}">${esc(x.full_name)}</option>`).join('');$('community').innerHTML='<option value="">Sin comunidad</option>'+communities.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
async function loadTasks(){let {data,error}=await sb.from('tasks').select('*,communities(name)').order('task_date',{ascending:true,nullsFirst:false}).order('task_time',{ascending:true,nullsFirst:false});if(!error){tasks=data||[];render()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});function render(){$('calendarControls').hidden=view!=='calendar';$('list').hidden=view==='calendar';if(view==='calendar')return renderCalendar();let a=tasks.filter(t=>view==='all'||t.channel===view);$('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No hay tareas.</div>'}
function card(t){let d=t.task_date?new Date(t.task_date+'T12:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}):'';return `<div class="card"><div class="row"><button class="check ${t.completed?'done':''}" onclick="toggle('${t.id}',${!t.completed})">${t.completed?'✓':''}</button><div style="flex:1"><div class="title ${t.completed?'doneText':''}">${esc(t.title)}</div>${t.details?`<div class="details">${esc(t.details)}</div>`:''}<div class="meta"><span class="chip ${t.channel}">${t.channel==='mine'?'MÍO':'OFICINA'}</span>${d?`<span class="chip">${d}${t.task_time?' · '+t.task_time.slice(0,5):''}</span>`:''}${t.assigned_name?`<span class="chip">${esc(t.assigned_name)}</span>`:''}${t.communities?.name?`<span class="chip">${esc(t.communities.name)}</span>`:''}${t.reminder_minutes!==null?`<span class="chip">🔔 ${t.reminder_minutes===1440?'24 h':t.reminder_minutes===60?'1 h':t.reminder_minutes===0?'hora':t.reminder_minutes+' min'}</span>`:''}</div></div><button class="more" onclick="toggleMenu(event,'${t.id}')">⋮</button><div class="menu" id="menu-${t.id}"><button onclick="openEditor('${t.id}')">Editar / ampliar</button><button class="danger" onclick="deleteTask('${t.id}')">Eliminar</button></div></div></div>`}function toggleMenu(e,id){e.stopPropagation();document.querySelectorAll('.menu').forEach(m=>{if(m.id!=='menu-'+id)m.classList.remove('on')});$('menu-'+id).classList.toggle('on')}document.addEventListener('click',()=>document.querySelectorAll('.menu').forEach(m=>m.classList.remove('on')));async function deleteTask(id){if(!confirm('¿Eliminar esta tarea?'))return;let {error}=await sb.from('tasks').delete().eq('id',id);if(error)return toast(error.message);await loadTasks()}
async function toggle(id,val){let {error}=await sb.from('tasks').update({completed:val,completed_at:val?new Date().toISOString():null,completed_by:val?user.id:null}).eq('id',id);if(error)return toast(error.message);await loadTasks()}
function refreshAssignmentState(){const isOffice=$('channel').value==='office';$('assigned').disabled=!isOffice;if(!isOffice)$('assigned').value=''}function openEditor(id=''){let t=tasks.find(x=>x.id===id);$('tid').value=id;$('edTitle').textContent=id?'Editar tarea':'Nueva tarea';$('title').value=t?.title||'';$('details').value=t?.details||'';$('channel').value=t?.channel||(view==='office'?'office':'mine');$('assigned').value=t?.assigned_email||'';$('community').value=t?.community_id||'';$('date').value=t?.task_date||iso();$('time').value=t?.task_time?.slice(0,5)||'';$('reminder').value=t?.reminder_minutes??'';refreshAssignmentState();$('editor').classList.add('on')}function closeEditor(){$('editor').classList.remove('on')}
async function saveTask(){let id=$('tid').value,ch=$('channel').value,ae=ch==='office'?$('assigned').value:'',member=team.find(x=>x.email===ae);let data={title:$('title').value.trim(),details:$('details').value.trim(),channel:ch,task_date:$('date').value||null,task_time:$('time').value||null,reminder_minutes:$('reminder').value===''?null:+$('reminder').value,community_id:$('community').value||null,assigned_email:ae||null,assigned_name:member?.full_name||null,assigned_to:member?.user_id||null};if(!data.title)return toast('Escribe la tarea');if(data.reminder_minutes!==null&&(!data.task_date||!data.task_time))return toast('Para un aviso debes indicar fecha y hora');let r=id?await sb.from('tasks').update(data).eq('id',id):await sb.from('tasks').insert({...data,created_by:user.id});if(r.error)return toast('No se pudo guardar: '+r.error.message);closeEditor();await loadTasks()}
function openVoice(){$('vpmsg').value='';$('vpins').value='';$('voice').classList.add('on')}function closeVoice(){$('voice').classList.remove('on')}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function listen(part){if(!SR)return toast('Este navegador no permite el dictado directo. Usa Chrome actualizado.');let r=new SR();r.lang='es-ES';r.onresult=e=>{let text=e.results[0][0].transcript.trim();$(part==='message'?'vpmsg':'vpins').value=text};r.onerror=()=>toast('No se ha podido usar el micrófono');r.start()}
function norm(s){return(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}const nums={una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiuna:21,veintiuno:21,veintidos:22};function findTime(n){let m=n.match(/(?:a las?|sobre las?)\s+(\d{1,2})(?::(\d{2}))?(?:\s+(y media|y cuarto|menos cuarto))?/),h=null,mi=0;if(m){h=+m[1];mi=m[2]?+m[2]:0;if(m[3]==='y media')mi=30;if(m[3]==='y cuarto')mi=15;if(m[3]==='menos cuarto'){h=(h+23)%24;mi=45}}if(h===null){for(const [w,v] of Object.entries(nums)){let re=new RegExp('(?:a las?|sobre las?)\\s+'+w+'(?:\\s+(y media|y cuarto|menos cuarto))?'),mm=n.match(re);if(mm){h=v;if(mm[1]==='y media')mi=30;if(mm[1]==='y cuarto')mi=15;if(mm[1]==='menos cuarto'){h=(h+23)%24;mi=45}break}}}if(h===null)return'';if(/de la (tarde|noche)/.test(n)&&h<12)h+=12;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}
function parseInstructions(s){let n=norm(s),p={channel:/\boficina\b/.test(n)?'office':(view==='mine'?'mine':'office'),assigned_email:'',assigned_name:'',community_id:'',date:'',time:''};let m=team.find(x=>n.includes(norm(x.full_name.split(' ')[0])));if(m){p.channel='office';p.assigned_email=m.email;p.assigned_name=m.full_name}let c=communities.find(x=>n.includes(norm(x.name)));if(c)p.community_id=c.id;let d=new Date();if(n.includes('pasado manana'))d.setDate(d.getDate()+2);else if(n.includes('manana'))d.setDate(d.getDate()+1);else if(!n.includes('hoy')){let days=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];let di=days.findIndex(x=>n.includes(x));if(di>=0){let diff=(di-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff)}}p.date=iso(d);p.time=findTime(n);return p}
async function createVoiceTask(){let message=$('vpmsg').value.trim(),instructions=$('vpins').value.trim();if(!message)return toast('Escribe o dicta el mensaje');let p=parseInstructions(instructions),m=team.find(x=>x.email===p.assigned_email);let data={title:message,details:'',channel:p.channel||'mine',task_date:p.date||iso(),task_time:p.time||null,reminder_minutes:null,community_id:p.community_id||null,assigned_email:p.channel==='office'?p.assigned_email||null:null,assigned_name:p.channel==='office'?p.assigned_name||null:null,assigned_to:p.channel==='office'?m?.user_id||null:null,created_by:user.id};let {error}=await sb.from('tasks').insert(data);if(error)return toast(error.message);closeVoice();await loadTasks();toast('Tarea creada')}
function moveCal(n){calOffset+=n;renderCalendar()}function renderCalendar(){let now=new Date(),start,title;if(calMode==='week'){let x=new Date(now);x.setDate(x.getDate()+calOffset*7);let day=x.getDay()||7;x.setDate(x.getDate()-day+1);start=x;title='Semana del '+x.toLocaleDateString('es-ES')}else{let x=new Date(now.getFullYear(),now.getMonth()+calOffset,1);let day=x.getDay()||7;start=new Date(x);start.setDate(x.getDate()-day+1);title=x.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}$('calTitle').textContent=title;let count=calMode==='week'?7:42,out='';for(let i=0;i<count;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=iso(d),a=tasks.filter(t=>t.task_date===ds);out+=`<div class="day ${ds===iso()?'today':''}"><b>${d.getDate()}</b>${a.slice(0,3).map(t=>`<div class="mini ${t.channel}">${esc(t.title)}</div>`).join('')}${a.length>3?`<div>+${a.length-3}</div>`:''}</div>`}$('cal').innerHTML=out}boot();
</script></body></html>
